<!DOCTYPE html>
<html lang="en">
<head>
    <title>Object Shorthand</title>
</head>
<body>
    <script>
        let product = {
            company : 'Shtruth',
            itemName : 'A-shirt',
            price : 1399,
        };
        let {company , price} = product;
        console.log(company);
        console.log(price);
    </script>
</body>
</html>
