<!DOCTYPE html>
<html lang="en">
<head>
    <title>Object Reference</title>
</head>
<body>
    <script>
        let a = 3;
        let b = a;
        console.log(`a=${a}, b=${b}`);
        
        a=6;
        console.log(`a=${a}, b=${b}`);

        let x = {num : 7};
        let y = x;
        console.log(`x=${x.num}, y=${y.num}`);

        x.num = 12;
        console.log(`x=${x.num}, y=${y.num}`);

        let p = {ks: 'shtruth'}
        let q = {ks: 'shtruth'}
        console.log(p == q);
    </script>
</body>
</html>
