<!DOCTYPE html>
<html lang="en">
<head>
    <title>Practice Exercise</title>
</head>
<body>
    <script>
        let age = 5;
        let gender = 'female';
        let finalValue;
        if(age <= 5){
            finalValue = 100;
        }
        else if(gender === 'female' || age <= 8){
            finalValue = 50;
        }
        else if(age >= 65){
            finalValue = 30;
        }
        else{
            finalValue = 0;
        }
        alert (`Your Final Discount is ${finalValue}%`);
    </script>
</body>
</html>
