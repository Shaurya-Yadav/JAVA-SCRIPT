<!DOCTYPE html>
<html lang="en">
<head>
    <title>Boolean Data Type</title>
</head>
<body>
    <script>
        let x = 6, y = 12;
        console.log(x > y); 
        console.log(typeof(x>y));
        console.log(typeof(true));
        console.log(typeof(false));
        console.log(typeof(3+4));
        console.log(typeof('true'));
    </script>
</body>
</html>
