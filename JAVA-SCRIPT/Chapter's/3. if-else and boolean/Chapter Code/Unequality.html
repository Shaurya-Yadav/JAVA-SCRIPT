<!DOCTYPE html>
<html lang="en">
<head>
    <title>Comparison Unequality Operator</title>
</head>
<body>
    <script>
        console.log(8 != 8);
        console.log(8 != 9);

        console.log(8 !== '8');
        console.log(8 !== 8);
        console.log(8 !== 9);

        
        console.log(8+4 === 6+6);
    </script>
</body>
</html>
