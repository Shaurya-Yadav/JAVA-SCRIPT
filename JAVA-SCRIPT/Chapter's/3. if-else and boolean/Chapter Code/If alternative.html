<!DOCTYPE html>
<html lang="en">
<head>
    <title>If Alternative</title>
</head>
<body>
    <script>
        //Ternary Operator: condition ? trueValue:FalseValue(Quick 1 line if-else)
        let marks = 22;
        let result = marks >= 33 ? 'Pass' : 'Fail';
        console.log(result);

        //Guard Operator: value || defaultValue
        let age;
        let defaultAge = age || 18;
        console.log(age);
        console.log(defaultAge);

        //Default Operator: value ?? fallbackValue
        let a;
        let s = a ?? 23;
        console.log(a);
        console.log(s);
    </script>
</body>
</html>
