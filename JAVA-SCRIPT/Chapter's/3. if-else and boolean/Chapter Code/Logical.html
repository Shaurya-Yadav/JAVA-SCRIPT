<!DOCTYPE html>
<html lang="en">
<head>
    <title>Logical && || ! Operator</title>
</head>
<body>
    <script>
        // AND(&&)Operator Both condition are true
        let marks = 67;
        console.log('Grade to According Marks');
        if(marks >= 60 && marks <= 100){
            console.log('A Grade');
        }
        else if(marks >= 50 && marks < 60){
            console.log('B Grade');
        }
        else if(marks >= 33 && marks < 50){
             console.log('C Grade');
        }
        else{
            console.log('Sorry u are Fail');
        }
        // OR(||)Operator Only One Condition are true
        let age = 23;
        if(age > 18 || age == 18){
            console.log('You are adult');
        }else{
            console.log('You are Child');          
        }
        // NOT(!)Operator Convert true to false and false tu true
        console.log(!true);
        console.log(!false);
    </script>
</body>
</html>
