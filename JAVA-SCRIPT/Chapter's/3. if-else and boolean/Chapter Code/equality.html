<!DOCTYPE html>
<html lang="en">
<head>
    <title>Comparison Equality Operator</title>
</head>
<body>
    <script>
        console.log(9 == 9.0);
        console.log(9 == 9.0);
        console.log(9 == '9.0');
        console.log(9 == '9.0');

        console.log(9 === 9.0);
        console.log(9 === 9.0);
        console.log(9 === '9.0');
        console.log(9 === '9.0');
    </script>
</body>
</html>
