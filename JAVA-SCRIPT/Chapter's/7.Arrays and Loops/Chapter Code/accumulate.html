<!DOCTYPE html>
<html lang="en">
<head>
    <title>Accumulate Pattern's</title>
</head>
<body>
    <script>
        let num = [2,5,3,7];
        let sum = 0;
        for(let i=0; i< num.length; i++){
            sum += num[i];
        }
        console.log(`Final Sum is ${sum}`);

        let square = [];
        for(let i=0; i< num.length; i++){
            square.push(num[i] * num[i]);
        }
        console.log(`Final Square is ${square}`);
    </script>
</body>
</html>
