<!DOCTYPE html>
<html lang="en">
<head>
    <title>Array or NotArr</title>
</head>
<body>
    <script>
        //object
        let arr = {shtruth : 25};
        console.log(typeof arr);

        //Array
        let Arr = ['shtruth', 25];
        console.log(typeof Arr);

        //cheak if arr= true or false
        console.log(Array.isArray(arr));
        console.log(Array.isArray(Arr));

        // cheak length of an array
        console.log(Arr.length);

        //Common Methods (push/pop, shift/unshift, splice, toString, sort, valueOf)
        console.log(`Cheak all the common methods`);
        let array = [2,5,3,7];
        console.log(array);

        array.push(9);
        console.log(array);

        array.pop();
        console.log(array);

        array.shift();
        console.log(array);

        array.unshift();
        console.log(array);

        let arrSp = [3,5,7,9,2,1,4,0];
        console.log(arrSp);
        arrSp.splice(1,3);
        console.log(arrSp);

        console.log(arrSp.toString());

        arrSp.sort();
        console.log(arrSp);

        console.log(arrSp.valueOf());

        let arrSp2 = arrSp;
        arrSp2[1]=25;
        console.log(arrSp);

        let[a,b,c,d,e] = arrSp;
        console.log(a+''+ b+''+ c+''+ d+''+ e+'');
    </script>
</body>
</html>
