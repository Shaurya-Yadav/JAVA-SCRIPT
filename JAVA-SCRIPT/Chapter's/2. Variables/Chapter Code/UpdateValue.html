<!DOCTYPE html>
<html lang="en">
<head>
    <title>Updating Value and Short Hand Operator</title>
</head>
<body>
    <script>
    // let a = 5;
    // let b = 7;
    // let c = a + 3;
    // console.log(c);
    // c = b + 3;
    // console.log(c);

    let a = 7;
    console.log(a);

    // a = a + 3; 
    a += 3;
    console.log(a); 
    a -= 3;
    console.log(a); 
    a *= 3;
    console.log(a); 
    a /= 3;
    console.log(a); 
    a %= 3;
    console.log(a);

    </script>

</body>
</html>
