<!DOCTYPE html>
<html lang="en">
<head>
    <title>Use Var, Let, Const Variable</title>
</head>
<body>
    <script>
         // Var variable access to anywhere or out
         var r = 5;
         var pi = 3.14;
         console.log(pi * r * r);

         // let variable generally protect a shield only access inner
         let base = 13;
         let height = 23;
         console.log(base * height);

         // Const is only one time define not to change value anyone
          const length = 50;
          const breath = 3;
          console.log(length * breath); 
    </script>
</body>
</html>
