<!DOCTYPE html>
<html lang="en">
<head>
    <title>Function</title>
</head>
<body>
    <script>
        let marks = 48;
        function PrintMark(){
            console.log(`Your Marks is: ${marks}`);
        }
        PrintMark();

        marks = 67;
        PrintMark();

        marks = 89;
        PrintMark();
    </script>
</body>
</html>
