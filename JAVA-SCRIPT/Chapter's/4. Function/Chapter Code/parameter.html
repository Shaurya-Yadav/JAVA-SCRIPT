<!DOCTYPE html>
<html lang="en">
<head>
    <title>Parameter</title>
</head>
<body>
    <script>
        function sum(x, y){
            let sum = x + y;
            return sum;
        }
        console.log(sum(3 , 5));
        console.log(sum(6 , 15));
        console.log(sum(35 , 2));
    </script>
</body>
</html>
