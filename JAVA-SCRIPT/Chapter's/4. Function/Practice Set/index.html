<!DOCTYPE html>
<html lang="en">
<head>
    <title>Practice Set</title>
</head>
<body>
    <script>
        function isOdd(num){
            let rem = num % 2;
            let isOdd = rem == 1;
            return isOdd;
        }
        console.log(isOdd(5));
        console.log(isOdd(44));
        console.log(isOdd(701));
        console.log('');

        function larger(num1 , num2){
            // if(num1 > num2){
            //     return num1;
            // }else{
            //     return num2;
            // }
            return num1 > num2 ? num1 : num2;
        }
        console.log(larger(7 , 9));
        console.log(larger(44 , 32));
        console.log(larger(216 , 319));
        console.log('');

        function toFahrenheit(celcius){
            return 9/5*celcius + 32;
        }
        console.log(toFahrenheit(37));
        console.log(toFahrenheit(12));
        console.log(toFahrenheit(87));
    </script>
</body>
</html>
