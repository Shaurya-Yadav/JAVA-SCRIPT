<!DOCTYPE html>
<html lang="en">
<head>
    <title>DATE</title>
</head>
<body>
    <script>
        let OurDate = new Date();
        console.log(OurDate.getTime());
        console.log(OurDate.getTime());
        console.log(OurDate.getDay());
        console.log(OurDate.getFullYear());
        console.log(OurDate.getHours());
        console.log(OurDate.getMonth());
        console.log(OurDate.getMilliseconds());
    </script>
</body>
</html>
