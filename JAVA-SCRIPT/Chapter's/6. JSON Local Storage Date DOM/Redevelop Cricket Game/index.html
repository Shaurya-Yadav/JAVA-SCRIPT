<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cricket Game</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Shtruth Cricket Game🏏👕</h1> 

    <button class="choice-btn" onclick="
     let ComChoice = generateComChoice();

    let resultMsg = getResult('Bat' , ComChoice);
    showResult('Bat', ComChoice, resultMsg);
    " > <img src="images/bat.png" alt="Bat img" class="choice_img"> 🏏</button>

    <button class="choice-btn" onclick="
     ComChoice = generateComChoice();

    resultMsg = getResult('Ball' , ComChoice);

    showResult('Ball', ComChoice, resultMsg);
    " >    <img src="images/ball.png" alt="Ball img" class="choice_img"> </button>

    <button class="choice-btn" onclick="
     ComChoice = generateComChoice();

    resultMsg = getResult('Stump' , ComChoice);

    showResult('Stump', ComChoice, resultMsg);
    " >    <img src="images/stump.png" alt="stump img" class="choice_img">🥢</button>


    <h3 id="user-move"></h3>
    <h3 id="computer-move"></h3>
    <h3 id="result"></h3>
    <h3 id="score"></h3>
    
    <button onclick="localStorage.clear()
    resetScore();
    "><img class="delete-btn" src="images/delete-img.png" alt="delete"></button>

    <script>
        let scoreStr = localStorage.getItem(`score`);
        let score;
        resetScore(scoreStr);

        function resetScore(scoreStr){

        score = scoreStr ? JSON .parse(scoreStr) : {
            win : 0,
            lost : 0,
            tie : 0,
          };

            score.showScore =  function(){
            return `Score- Won:${score.win}🏆, Lost:${score.lost}😓, Tie:${score.tie}🤷`;
            };
            showResult();
        }

       function generateComChoice(){
        let randNum = Math.random() * 3;
       if(randNum > 0 && randNum <= 1){
        return 'Bat';
       }
       else if(randNum > 1 && randNum <= 2){
        return 'Ball';
       }
        else{
        return 'Stump';
       }
      }
      function getResult(user , computer){
        if(user === 'Bat'){
      if(computer === 'Ball'){
         score.win++; 
          return 'You Won';
        }
        else if(computer === 'Bat'){
         score.tie++; 
           return `It's a Tie`;
        }
        else if(computer === 'Stump'){ 
         score.lost++; 
            return `Computer has Won`;
        }
            }

        else if(user === 'Ball'){
     if(computer === 'Ball'){
         score.tie++; 
         return `It's a Tie`;
        }
        else if(computer === 'Bat'){ 
         score.lost++; 
           return `Computer has Won`;
        }
        else if(computer === 'Stump'){
         score.win++; 
            return 'You Won';
        }
        }
        else{
        if(computer === 'Ball'){ 
         score.lost++; 
           return `Computer has Won`;
        }
        else if(computer === 'Bat'){
         score.win++; 
            return 'You Won';
        }
        else if(computer === 'Stump'){
         score.tie++; 
            return `It's a Tie`;
        }
        }
        }
        function showResult(user , computer , result){
            localStorage.setItem(`score`,JSON.stringify(score));

            document.querySelector('#user-move').innerText = user ? `You have choosen ${user}` : '';

            document.querySelector('#computer-move').innerText = computer ? `Computer Choice is ${computer}` : '';

            document.querySelector('#result').innerText =result || '';

            document.querySelector('#score').innerText = score.showScore();
        }
        
    </script>
</body>
</html>
